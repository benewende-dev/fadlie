[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fadlie"
version = "0.1.0"
description = "An agent that finds the same data living in systems your catalog does not connect, and the governance that stopped at one of them."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mcp>=2.0.0",
    "boto3>=1.34",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fadlie = "fadlie.__main__:main"

[tool.setuptools.packages.find]
include = ["fadlie*"]
